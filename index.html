<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f3" />
    <title>安信佳點名系統</title>
    <meta name="apple-mobile-web-app-title" content="安信佳" />
    <link rel="icon" type="image/png" sizes="48x48" href="./assets/branding/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/branding/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="auth-gate" id="auth-gate" aria-busy="true" aria-live="polite">
      <section class="auth-card" aria-labelledby="auth-title">
        <img class="brand-logo" src="./assets/branding/anshinjia-logo.png" width="854" height="348" alt="安信佳" />
        <p class="eyebrow">數學課程管理</p>
        <h1 id="auth-title" tabindex="-1">正在確認登入狀態…</h1>
        <p class="auth-message" id="auth-message">請稍候。</p>
        <button class="button-primary auth-button" id="google-sign-in" type="button" hidden>使用 Google 登入</button>
      </section>
    </main>

    <div id="management-system" hidden>
      <header class="app-header">
        <div class="brand">
          <img class="brand-logo" src="./assets/branding/anshinjia-logo.png" width="854" height="348" alt="安信佳" />
          <div>
            <p class="eyebrow">數學課程管理</p>
            <h1>點名系統</h1>
          </div>
        </div>
        <div class="header-actions">
          <span class="storage-status" id="storage-status">尚未連線</span>
          <button class="button-secondary sign-out-button" id="sign-out" type="button">登出</button>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切換深色模式">深</button>
        </div>
      </header>

      <main class="app-shell">
        <nav class="tab-bar" aria-label="主要功能">
          <button class="tab is-active" data-route="roll-call" type="button">今日點名</button>
          <button class="tab" data-route="students" type="button">學生</button>
          <button class="tab" data-route="schedule" type="button">排課</button>
          <button class="tab" data-route="records" type="button">紀錄</button>
          <button class="tab" data-route="payment" type="button">繳費</button>
          <button class="tab" data-route="export-backup" type="button">匯出備份</button>
          <button class="tab" data-route="booking" type="button">選課活動</button>
        </nav>

        <section id="app" aria-live="polite"></section>
      </main>

      <div id="toast" class="toast" role="status"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js",
          "firebase/functions": "https://www.gstatic.com/firebasejs/12.16.0/firebase-functions.js"
        }
      }
    </script>
    <script src="./js/vendor/jszip.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
